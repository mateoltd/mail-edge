        providerId:
          $ref: "#/components/schemas/ProviderId"
        adapterVersion:
          type: string
          minLength: 1
          maxLength: 128
        mode:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
    DesiredBinding:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - tenantId
        - domainALabel
        - direction
        - providerInstanceId
        - configRevision
        - requirementsDigest
      properties:
        schemaVersion:
          const: v1
        tenantId:
          $ref: "#/components/schemas/UuidV7"
        domainALabel:
          type: string
          minLength: 1
          maxLength: 253
        direction:
          type: string
          enum: [inbound, outbound]
        providerInstanceId:
          $ref: "#/components/schemas/UuidV7"
        configRevision:
          type: string
          minLength: 1
          maxLength: 128
        requirementsDigest:
          $ref: "#/components/schemas/Sha256"
    BindingPlan:
      type: object
      additionalProperties: false
      required: [schemaVersion, identity, desiredDigest, createdAt, expiresAt, operations]
      properties:
        schemaVersion:
          const: v1
        identity:
          $ref: "#/components/schemas/AdapterIdentity"
        desiredDigest:
          $ref: "#/components/schemas/Sha256"
        createdAt:
          type: string
          minLength: 20
          maxLength: 35
        expiresAt:
