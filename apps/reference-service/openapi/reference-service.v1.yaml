openapi: 3.1.0
info:
  title: Mail Edge reference service
  version: 1.0.0
  description: Provider-neutral runtime, tenant data plane, and operator control plane.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Health
  - name: Provider ingress
  - name: Tenant
  - name: Operator
paths:
  /livez:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        "200":
          description: HTTP process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Every required runtime component is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one required runtime component is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/providers/{providerId}/{adapterVersion}/{mode}/instances/{providerInstanceId}/inbound/{providerPath}:
    post:
      tags: [Provider ingress]
      operationId: ingestProviderMessage
      description:
        The exact provider adapter authenticates and consumes the one-shot byte stream at its
        registered provider path.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/AdapterVersion"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/ProviderInstanceId"
        - $ref: "#/components/parameters/ProviderPath"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Adapter-defined safe success response.
        "202":
          description: Verified ingress was durably accepted or recognized as a replay.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/providers/{providerId}/{adapterVersion}/{mode}/instances/{providerInstanceId}/feedback:
    post:
      tags: [Provider ingress]
      operationId: ingestProviderFeedback
      description: The exact provider adapter authenticates, parses, and hands off feedback durably.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/AdapterVersion"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Feedback was durably handed off.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/raw-messages:
    post:
      tags: [Tenant]
      operationId: storeRawMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Encrypted raw message was stored durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMessageRef"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/raw-access-grants/{grantId}/raw:
    get:
      tags: [Tenant]
      operationId: downloadRawMessageByGrant
      description:
        Streams the exact raw object in constant memory. Ranges, redirects, and content encodings
        are rejected; authorization is audience, subject, operation, expiry, and fence bound.
      security:
        - rawGrantAuth: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - name: X-Mail-Edge-Signature-Audience
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: X-Mail-Edge-Subject-Id
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: X-Mail-Edge-Operation
          in: header
          required: true
          schema: { const: raw_download }
      responses:
        "200":
          description:
            Authenticated raw stream; a single-use grant is consumed before the object opens.
          headers:
            Accept-Ranges:
              schema: { const: none }
            Cache-Control:
              schema: { const: "no-store, private" }
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/raw-access-grants:
    post:
      tags: [Tenant]
      operationId: issueRawAccessGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, raw, singleUse, subjectId]
              properties:
                purpose: { type: string, enum: [operator_review, reconciliation] }
                raw: { $ref: "#/components/schemas/RawMessageRef" }
                singleUse: { type: boolean }
                subjectId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201":
          description: Short-lived, fenced raw access grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawAccessGrant" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/raw-access-grants/{grantId}/revoke:
    post:
      tags: [Tenant]
      operationId: revokeRawAccessGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GrantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedFence]
              properties:
                expectedFence: { type: integer, minimum: 0 }
      responses:
        "204": { description: Grant revoked and fence advanced. }
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/outbound-intents:
    post:
      tags: [Tenant]
      operationId: createOutboundIntent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundIntentRequest"
      responses:
        "200":
          description: Existing idempotent intent snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "202":
          description: New outbound intent accepted durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/outbound-intents/{intentId}:
    get:
      tags: [Tenant]
      operationId: getOutboundIntent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IntentId"
      responses:
        "200":
          description: Durable outbound intent snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/inbound-receipts/{receiptId}:
    get:
      tags: [Tenant]
      operationId: getInboundReceipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Durable verified inbound receipt snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/bindings/{bindingId}/versions/{bindingVersion}:
    get:
      tags: [Tenant]
      operationId: inspectTenantBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BindingId"
        - $ref: "#/components/parameters/BindingVersion"
      responses:
        "200":
          description: Tenant-scoped binding lifecycle snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSnapshot" }
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/outbound-intents/{intentId}/quarantine:
    get:
      tags: [Tenant]
      operationId: inspectOutboundQuarantine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IntentId"
      responses:
        "200":
          description: Tenant-scoped quarantine snapshot without raw content or secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSnapshot" }
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/inbound-receipts/{receiptId}/quarantine:
    get:
      tags: [Tenant]
      operationId: inspectInboundQuarantine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Tenant-scoped quarantine snapshot without raw content or secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSnapshot" }
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/operator/tenants/{tenantId}/bindings/{bindingId}/versions/{bindingVersion}/{action}:
    post:
      tags: [Operator]
      operationId: transitionBindingLifecycle
      description:
        Applies activate, drain, or retire under optimistic concurrency. Drain prevents new
        selection while in-flight work remains fenced to its durable snapshot; retire requires
        completed drain.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BindingId"
        - $ref: "#/components/parameters/BindingVersion"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [activate, drain, retire] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleDecision" }
      responses:
        "200":
          description: Updated binding state and concurrency version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSnapshot" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/operator/tenants/{tenantId}/outbound-intents/{intentId}/quarantine-decisions:
    post:
      tags: [Operator]
      operationId: decideOutboundQuarantine
      description:
        Records an audited terminal decision or privileged retry authorization. authorize_retry
        requires the separate privileged operator credential.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IntentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundQuarantineDecision" }
      responses:
        "200":
          description: Audited decision and resulting snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSnapshot" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/operator/tenants/{tenantId}/inbound-receipts/{receiptId}/quarantine-decisions:
    post:
      tags: [Operator]
      operationId: decideInboundQuarantine
      description:
        Releases a quarantined receipt once or applies an audited terminal action under version and
        fence checks.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InboundQuarantineDecision" }
      responses:
        "200":
          description: Audited decision and resulting snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSnapshot" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/operator/providers:
    get:
      tags: [Operator]
      operationId: listProviders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Exact registered adapter identities and descriptors.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers]
                properties:
                  providers:
                    type: array
                    maxItems: 10000
                    items:
                      type: object
                      required: [identity, descriptor]
                      properties:
                        identity:
                          $ref: "#/components/schemas/AdapterIdentity"
                        descriptor:
                          $ref: "#/components/schemas/ContractSnapshot"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/bindings/plan:
    post:
      tags: [Operator]
      operationId: planProviderBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredBinding"
      responses:
        "200":
          description: Validated provider-neutral binding plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/plans/apply:
    post:
      tags: [Operator]
      operationId: applyProviderBindingPlan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation, plan]
              properties:
                operation:
                  $ref: "#/components/schemas/ControlOperation"
                plan:
                  $ref: "#/components/schemas/BindingPlan"
      responses:
        "200":
          description: Validated applied provider resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/bindings/discover:
    post:
      tags: [Operator]
      operationId: discoverProviderBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [binding]
              properties:
                binding:
                  $ref: "#/components/schemas/RouteBinding"
      responses:
        "200":
          description: Validated discovered provider resources and drift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/bindings/delete:
    post:
      tags: [Operator]
      operationId: deleteProviderBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [binding, operation]
              properties:
                binding:
                  $ref: "#/components/schemas/RouteBinding"
                operation:
                  $ref: "#/components/schemas/ControlOperation"
      responses:
        "200":
          description: Validated provider deletion evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSnapshot"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    rawGrantAuth:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderId"
    AdapterVersion:
      name: adapterVersion
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Mode:
      name: mode
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_-]{0,63}$"
    ProviderInstanceId:
      name: providerInstanceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    ProviderPath:
      name: providerPath
      in: path
      required: true
      description: Adapter-owned ingress path segment, such as raw-mime for Mailgun.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    IntentId:
      name: intentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    BindingVersion:
      name: bindingVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Problem:
      description: Versioned privacy-safe Mail Edge problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    UuidV7:
      type: string
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Sha256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
    ProviderId:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready, not_ready]
    RawMessageRef:
      type: object
      additionalProperties: false
      required: [schemaVersion, blobId, sha256, size, mediaType]
      properties:
        schemaVersion:
          const: v1
        blobId:
          $ref: "#/components/schemas/UuidV7"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          type: integer
          minimum: 0
          maximum: 26214400
        mediaType:
          const: message/rfc822
    SmtpEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, mailFrom, rcptTo, smtpUtf8]
      properties:
        schemaVersion:
          const: v1
        mailFrom:
          type: [string, "null"]
          maxLength: 512
        rcptTo:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [address]
            properties:
              address:
                type: string
                minLength: 3
                maxLength: 512
              dsn:
                type: object
                maxProperties: 2
        smtpUtf8:
          type: boolean
        body:
          type: string
          enum: [7bit, 8bitmime, binarymime]
        requireTls:
          type: boolean
        dsn:
          type: object
          maxProperties: 2
    OutboundIntentRequest:
      type: object
      additionalProperties: false
      required: [envelope, raw]
      properties:
        envelope:
          $ref: "#/components/schemas/SmtpEnvelope"
        raw:
          $ref: "#/components/schemas/RawMessageRef"
        opaqueReplyToken:
          type: string
          minLength: 1
          maxLength: 2048
    RawAccessGrant:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          grantId,
          tenantId,
          raw,
          audience,
          operation,
          subjectId,
          purpose,
          singleUse,
          opaqueToken,
          downloadPath,
          issuedAt,
          expiresAt,
        ]
      properties:
        schemaVersion: { const: v1 }
        grantId: { $ref: "#/components/schemas/UuidV7" }
        tenantId: { $ref: "#/components/schemas/UuidV7" }
        raw: { $ref: "#/components/schemas/RawMessageRef" }
        audience: { type: string, minLength: 1, maxLength: 128 }
        operation: { const: raw_download }
        subjectId: { type: string, minLength: 1, maxLength: 128 }
        purpose: { type: string, enum: [application_delivery, operator_review, reconciliation] }
        singleUse: { type: boolean }
        opaqueToken: { type: string, minLength: 43, maxLength: 128 }
        downloadPath: { type: string, minLength: 1, maxLength: 256 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    LifecycleDecision:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        reasonCode: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    OutboundQuarantineDecision:
      type: object
      additionalProperties: false
      required: [action, evidence, expectedFence, expectedVersion, reasonCode]
