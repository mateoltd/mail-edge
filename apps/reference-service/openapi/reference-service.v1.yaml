                  type: string
                - const: none
                  type: string
            exactDomainCatchAll:
              type: boolean
            bytePreservation:
              anyOf:
                - const: verified_exact
                  type: string
                - const: provider_mutated
                  type: string
                - const: unknown
                  type: string
            maxBytes:
              maximum: 9007199254740991
              minimum: 0
              type: integer
          required:
            - supported
            - acquisition
            - signatureCoverage
            - replayIdentity
            - exactDomainCatchAll
            - bytePreservation
        outbound:
          additionalProperties: false
          type: object
          properties:
            supported:
              type: boolean
            transports:
              maxItems: 3
              uniqueItems: true
              type: array
              items:
                anyOf:
                  - const: http_binary
                    type: string
                  - const: http_utf8_json
                    type: string
                  - const: smtp_raw
                    type: string
            bytePreservation:
              anyOf:
                - const: verified_exact
                  type: string
                - const: provider_mutated
                  type: string
                - const: unknown
                  type: string
            mimeMutation:
              maxItems: 5
              uniqueItems: true
              type: array
              items:
                anyOf:
                  - const: none
                    type: string
                  - const: transport_headers
                    type: string
                  - const: dkim_signature
                    type: string
                  - const: content_reencoding
                    type: string
                  - const: unknown
                    type: string
            envelope:
              additionalProperties: false
              type: object
              properties:
                nullReversePath:
                  type: boolean
                multipleRecipients:
                  type: boolean
                smtpUtf8:
                  type: boolean
                dsnRetEnvid:
                  type: boolean
                perRecipientDsn:
                  type: boolean
                bodyModes:
                  maxItems: 3
                  uniqueItems: true
                  type: array
                  items:
                    anyOf:
                      - const: 7bit
                        type: string
                      - const: 8bitmime
                        type: string
                      - const: binarymime
                        type: string
                requireTls:
                  type: boolean
              required:
                - nullReversePath
                - multipleRecipients
                - smtpUtf8
                - dsnRetEnvid
                - perRecipientDsn
                - bodyModes
                - requireTls
            idempotency:
              additionalProperties: false
              type: object
              properties:
                mode:
                  anyOf:
                    - const: none
                      type: string
                    - const: header
                      type: string
                    - const: request_key
                      type: string
                scope:
                  anyOf:
                    - const: account
                      type: string
                    - const: domain
                      type: string
                ttlSeconds:
                  maximum: 31536000
                  minimum: 1
                  type: integer
              required:
                - mode
            reconciliation:
              additionalProperties: false
              type: object
              properties:
                supported:
                  type: boolean
                keys:
                  maxItems: 16
                  uniqueItems: true
                  type: array
                  items:
                    maxLength: 64
                    minLength: 1
                    type: string
                canProve:
                  maxItems: 3
                  uniqueItems: true
                  type: array
                  items:
                    $ref: "#/components/schemas/DeliveryCertainty"
              required:
                - supported
                - keys
                - canProve
            maxBytes:
              maximum: 9007199254740991
              minimum: 0
              type: integer
            rateLimit:
              additionalProperties: false
              maxProperties: 16
              type: object
              patternProperties:
                ^(.*)$:
                  maximum: 9007199254740991
                  minimum: 0
                  type: number
          required:
            - supported
            - transports
            - bytePreservation
            - mimeMutation
            - envelope
            - idempotency
            - reconciliation
        feedback:
          additionalProperties: false
          type: object
          properties:
            supported:
              type: boolean
            kinds:
              maxItems: 9
              uniqueItems: true
              type: array
              items:
                anyOf:
                  - const: accepted
                    type: string
                  - const: delivered
                    type: string
                  - const: deferred
                    type: string
                  - const: bounced
                    type: string
                  - const: complained
                    type: string
                  - const: suppressed
                    type: string
                  - const: opened
                    type: string
                  - const: clicked
                    type: string
                  - const: unsubscribed
                    type: string
            perRecipient:
              type: boolean
            signatureCoverage:
              anyOf:
                - const: whole_body
                  type: string
                - const: body_digest
                  type: string
                - const: token_timestamp_only
                  type: string
                - const: worker_event
                  type: string
                - const: none
                  type: string
          required:
            - supported
            - kinds
            - perRecipient
            - signatureCoverage
        controlPlane:
          additionalProperties: false
          type: object
          properties:
            supported:
              type: boolean
            domainProvisioning:
              type: boolean
            dnsDiscovery:
              type: boolean
            driftDiscovery:
              type: boolean
            exactDomainCatchAll:
              type: boolean
          required:
            - supported
            - domainProvisioning
            - dnsDiscovery
            - driftDiscovery
            - exactDomainCatchAll
        prerequisites:
          maxItems: 32
          uniqueItems: true
          type: array
          items:
            maxLength: 256
            minLength: 1
            type: string
        evidence:
          maxItems: 64
          type: array
          items:
            $ref: "#/components/schemas/CapabilityEvidence"
      required:
        - schemaVersion
        - providerId
        - adapterVersion
        - maturity
        - inbound
        - outbound
        - feedback
        - controlPlane
        - prerequisites
        - evidence
    ProviderId:
      $id: urn:mail-edge:schema:v1:provider-id
      maxLength: 63
      minLength: 1
      pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
      type: string
    ProviderInstanceId:
      $id: urn:mail-edge:schema:v1:provider-instance-id
      maxLength: 36
      minLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      type: string
    RawAccessGrant:
      $id: urn:mail-edge:schema:v1:raw-access-grant
      additionalProperties: false
      type: object
      properties:
        schemaVersion:
          const: v1
          type: string
        grantId:
          $ref: "#/components/schemas/RawAccessGrantId"
        tenantId:
          $ref: "#/components/schemas/TenantId"
        raw:
          $ref: "#/components/schemas/RawMessageRef"
        audience:
          maxLength: 128
          minLength: 1
          type: string
        operation:
          const: raw_download
          type: string
        subjectId:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
          type: string
        purpose:
          anyOf:
            - const: application_delivery
              type: string
            - const: operator_review
              type: string
            - const: reconciliation
              type: string
        singleUse:
          type: boolean
        opaqueToken:
          maxLength: 128
          minLength: 43
          pattern: ^[A-Za-z0-9_-]{43,128}$
          type: string
        downloadPath:
          maxLength: 256
          minLength: 1
          pattern: ^/v1/raw-access-grants/[0-9a-f-]{36}/raw$
          type: string
        issuedAt:
          $ref: "#/components/schemas/Rfc3339Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Rfc3339Timestamp"
      required:
        - schemaVersion
        - grantId
        - tenantId
        - raw
        - audience
        - operation
        - subjectId
        - purpose
        - singleUse
        - opaqueToken
        - downloadPath
        - issuedAt
        - expiresAt
    RawAccessGrantId:
      $id: urn:mail-edge:schema:v1:raw-access-grant-id
      maxLength: 36
      minLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      type: string
    RawMessageRef:
      $id: urn:mail-edge:schema:v1:raw-message-ref
      additionalProperties: false
      type: object
      properties:
        schemaVersion:
          const: v1
          type: string
        blobId:
          $ref: "#/components/schemas/BlobId"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          maximum: 26214400
          minimum: 0
          type: integer
        mediaType:
          const: message/rfc822
          type: string
      required:
        - schemaVersion
        - blobId
        - sha256
        - size
        - mediaType
    ReceiptId:
      $id: urn:mail-edge:schema:v1:receipt-id
      maxLength: 36
      minLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      type: string
    Rfc3339Timestamp:
      $id: urn:mail-edge:schema:v1:rfc3339-timestamp
      format: date-time
      maxLength: 35
      minLength: 20
      pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]{1,9})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$
      type: string
    RouteBindingSnapshot:
      $id: urn:mail-edge:schema:v1:route-binding-snapshot
      additionalProperties: false
      type: object
      properties:
        schemaVersion:
          const: v1
          type: string
        bindingId:
          $ref: "#/components/schemas/BindingId"
        bindingVersion:
          maximum: 9007199254740991
          minimum: 1
          type: integer
        tenantId:
          $ref: "#/components/schemas/TenantId"
        domainALabel:
          $ref: "#/components/schemas/DomainALabel"
        direction:
          anyOf:
            - const: inbound
              type: string
            - const: outbound
              type: string
        providerId:
          $ref: "#/components/schemas/ProviderId"
        adapterVersion:
          maxLength: 64
          minLength: 1
          type: string
        adapterMode:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          type: string
        dispatchTransport:
          anyOf:
            - const: http
              type: string
            - const: smtp
              type: string
        providerInstanceId:
          $ref: "#/components/schemas/ProviderInstanceId"
        providerResourceIds:
          $ref: "#/components/schemas/BoundedStringMap"
        capabilityDigest:
          $ref: "#/components/schemas/Sha256"
        configRevision:
          maxLength: 128
          minLength: 1
          type: string
        createdAt:
          $ref: "#/components/schemas/Rfc3339Timestamp"
      required:
        - schemaVersion
        - bindingId
        - bindingVersion
        - tenantId
        - domainALabel
        - direction
        - providerId
        - adapterVersion
        - providerInstanceId
        - providerResourceIds
        - capabilityDigest
        - configRevision
        - createdAt
    SafeDetails:
      $id: urn:mail-edge:schema:v1:safe-details
      additionalProperties: false
      maxProperties: 16
      type: object
      patternProperties:
        ^[a-z][A-Za-z0-9]*$:
          anyOf:
            - maxLength: 256
              type: string
            - maximum: 9007199254740991
              minimum: -9007199254740991
              type: number
            - type: boolean
    Sha256:
      $id: urn:mail-edge:schema:v1:sha256
      maxLength: 64
      minLength: 64
      pattern: ^[0-9a-f]{64}$
      type: string
    SmtpEnvelope:
      $id: urn:mail-edge:schema:v1:smtp-envelope
      additionalProperties: false
      type: object
      properties:
        schemaVersion:
          const: v1
          type: string
        mailFrom:
          anyOf:
            - maxLength: 512
              minLength: 3
              type: string
            - type: "null"
        rcptTo:
          maxItems: 1000
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/SmtpRecipient"
        smtpUtf8:
          type: boolean
        body:
          anyOf:
            - const: 7bit
              type: string
            - const: 8bitmime
              type: string
            - const: binarymime
              type: string
        requireTls:
          type: boolean
        dsn:
          additionalProperties: false
          type: object
          properties:
            ret:
              anyOf:
                - const: full
                  type: string
                - const: headers
                  type: string
            envelopeId:
              maxLength: 100
              minLength: 1
              pattern: ^(?:[\x21-\x2a\x2c-\x3c\x3e-\x7e]|\+[0-9A-F]{2})+$
              type: string
      required:
        - schemaVersion
        - mailFrom
        - rcptTo
        - smtpUtf8
    SmtpRecipient:
      $id: urn:mail-edge:schema:v1:smtp-recipient
      additionalProperties: false
      type: object
      properties:
        address:
          maxLength: 512
          minLength: 3
          type: string
        dsn:
          additionalProperties: false
          type: object
          properties:
            notify:
              $ref: "#/components/schemas/DsnNotify"
            originalRecipient:
              maxLength: 500
              minLength: 3
              pattern: ^[A-Za-z][A-Za-z0-9-]{0,63};(?:[\x21-\x2a\x2c-\x3c\x3e-\x7e]|\+[0-9A-F]{2})+$
              type: string
      required:
        - address
    TenantId:
      $id: urn:mail-edge:schema:v1:tenant-id
      maxLength: 36
      minLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      type: string
    VerifiedInboundReceipt:
      $id: urn:mail-edge:schema:v1:verified-inbound-receipt
      additionalProperties: false
      type: object
      properties:
        schemaVersion:
          const: v1
          type: string
        receiptId:
          $ref: "#/components/schemas/ReceiptId"
        tenantId:
          $ref: "#/components/schemas/TenantId"
        providerId:
          $ref: "#/components/schemas/ProviderId"
        providerInstanceId:
          $ref: "#/components/schemas/ProviderInstanceId"
        providerReceiptKey:
          maxLength: 256
          minLength: 1
          type: string
        binding:
          $ref: "#/components/schemas/RouteBindingSnapshot"
        envelope:
          $ref: "#/components/schemas/SmtpEnvelope"
        raw:
          $ref: "#/components/schemas/RawMessageRef"
        verificationEvidenceDigest:
          $ref: "#/components/schemas/Sha256"
        receivedAt:
          $ref: "#/components/schemas/Rfc3339Timestamp"
        state:
          anyOf:
            - const: received
              type: string
            - const: acquiring
              type: string
            - const: stored
              type: string
            - const: routing
              type: string
            - const: delivering
              type: string
            - const: retry_wait
              type: string
            - const: delivered
              type: string
            - const: quarantined
              type: string
            - const: dead_letter
              type: string
            - const: purged
              type: string
        version:
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - schemaVersion
        - receiptId
        - tenantId
        - providerId
        - providerInstanceId
        - providerReceiptKey
        - binding
        - envelope
        - raw
        - verificationEvidenceDigest
        - receivedAt
        - state
        - version
