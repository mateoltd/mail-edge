            additionalProperties: false
            required: [operationId, kind, resourceType, parameters]
            properties:
              operationId:
                type: string
                pattern: "^[a-z][a-z0-9_-]*$"
              kind:
                type: string
                enum: [create, update, verify]
              resourceType:
                type: string
                pattern: "^[a-z][a-z0-9_-]*$"
              parameters:
                type: object
                maxProperties: 64
    RouteBinding:
      type: object
