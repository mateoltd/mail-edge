openapi: 3.1.0
info:
  title: Mail Edge reference service
  version: 1.0.0
  description: Provider-neutral runtime, tenant data plane, and operator control plane.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Health
  - name: Provider ingress
  - name: Tenant
  - name: Operator
paths:
  /livez:
    get:
      tags:
        - Health
      operationId: getLiveness
      responses:
        "200":
          description: HTTP process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags:
        - Health
      operationId: getReadiness
      responses:
        "200":
          description: Every required runtime component is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one required runtime component is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/degraded:
    get:
      tags:
        - Health
      operationId: getDegradedStatus
      responses:
        "200":
          description: Aggregate readiness and privacy-safe status for every registered adapter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegradedHealth"
  /v1/providers/{providerId}/{adapterVersion}/{mode}/instances/{providerInstanceId}/inbound/{providerPath}:
    post:
      tags:
        - Provider ingress
      operationId: ingestProviderMessage
      description:
        The exact provider adapter authenticates and consumes the one-shot byte stream at its
        registered provider path.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/AdapterVersion"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/ProviderInstanceId"
        - $ref: "#/components/parameters/ProviderPath"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Adapter-defined safe success response.
        "202":
          description: Verified ingress was durably accepted or recognized as a replay.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/providers/{providerId}/{adapterVersion}/{mode}/instances/{providerInstanceId}/feedback:
    post:
      tags:
        - Provider ingress
      operationId: ingestProviderFeedback
      description: The exact provider adapter authenticates, parses, and hands off feedback durably.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/AdapterVersion"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Feedback was durably handed off.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/raw-messages:
    post:
      tags:
        - Tenant
      operationId: storeRawMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Encrypted raw message was stored durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawMessageRef"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/raw-access-grants/{grantId}/raw:
    get:
      tags:
        - Tenant
      operationId: downloadRawMessageByGrant
      description:
        Streams the exact raw object in constant memory. Ranges, redirects, and content encodings
        are rejected; authorization is audience, subject, operation, expiry, and fence bound.
      security:
        - rawGrantAuth: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - name: X-Mail-Edge-Signature-Audience
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Mail-Edge-Subject-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Mail-Edge-Operation
          in: header
          required: true
          schema:
            const: raw_download
      responses:
        "200":
          description:
            Authenticated raw stream; a single-use grant is consumed before the object opens.
          headers:
            Accept-Ranges:
              schema:
                const: none
            Cache-Control:
              schema:
                const: no-store, private
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/raw-access-grants:
    post:
      tags:
        - Tenant
      operationId: issueRawAccessGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawAccessGrantRequest"
      responses:
        "201":
          description: Short-lived, fenced raw access grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawAccessGrant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/raw-access-grants/{grantId}/revoke:
    post:
      tags:
        - Tenant
      operationId: revokeRawAccessGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/GrantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawAccessGrantRevocation"
      responses:
        "204":
          description: Grant revoked and fence advanced.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/outbound-intents:
    post:
      tags:
        - Tenant
      operationId: createOutboundIntent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundIntentRequest"
      responses:
        "200":
          description: Existing idempotent intent snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundIntent"
        "202":
          description: New outbound intent accepted durably.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundIntent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/outbound-intents/{intentId}:
    get:
      tags:
        - Tenant
      operationId: getOutboundIntent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IntentId"
      responses:
        "200":
          description: Durable outbound intent snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundIntent"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/inbound-receipts/{receiptId}:
    get:
      tags:
        - Tenant
      operationId: getInboundReceipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Durable verified inbound receipt snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedInboundReceipt"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances:
    get:
      tags:
        - Operator
      operationId: listProviderInstances
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant-scoped provider-instance catalog without secrets or resource details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInstanceList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/bindings/{bindingId}/versions/{bindingVersion}:
    get:
      tags:
        - Tenant
      operationId: inspectTenantBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BindingId"
        - $ref: "#/components/parameters/BindingVersion"
      responses:
        "200":
          description: Tenant-scoped binding lifecycle snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingControlView"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/outbound-intents/{intentId}/quarantine:
    get:
      tags:
        - Tenant
      operationId: inspectOutboundQuarantine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IntentId"
      responses:
        "200":
          description: Tenant-scoped quarantine snapshot without raw content or secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundQuarantineView"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/tenants/{tenantId}/inbound-receipts/{receiptId}/quarantine:
    get:
      tags:
        - Tenant
      operationId: inspectInboundQuarantine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Tenant-scoped quarantine snapshot without raw content or secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundQuarantineView"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/operator/tenants/{tenantId}/bindings/{bindingId}/versions/{bindingVersion}/{action}:
    post:
      tags:
        - Operator
      operationId: transitionBindingLifecycle
      description:
        Applies activate, drain, or retire under optimistic concurrency. Drain prevents new
        selection while in-flight work remains fenced to its durable snapshot; retire requires
        completed drain.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/BindingId"
        - $ref: "#/components/parameters/BindingVersion"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - activate
              - drain
              - retire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingLifecycleDecision"
      responses:
        "200":
          description: Updated binding state and concurrency version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingControlView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/operator/tenants/{tenantId}/outbound-intents/{intentId}/quarantine-decisions:
    post:
      tags:
        - Operator
      operationId: decideOutboundQuarantine
      description:
        Records an audited terminal decision or privileged retry authorization. authorize_retry
        requires the separate privileged operator credential.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IntentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundQuarantineDecision"
      responses:
        "200":
          description: Audited decision and resulting snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundQuarantineView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/operator/tenants/{tenantId}/inbound-receipts/{receiptId}/quarantine-decisions:
    post:
      tags:
        - Operator
      operationId: decideInboundQuarantine
      description:
        Releases a quarantined receipt once or applies an audited terminal action under version and
        fence checks.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundQuarantineDecision"
      responses:
        "200":
          description: Audited decision and resulting snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundQuarantineView"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/operator/providers:
    get:
      tags:
        - Operator
      operationId: listProviders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Exact registered adapter identities and descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderRegistrationList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/bindings/plan:
    post:
      tags:
        - Operator
      operationId: planProviderBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredBinding"
      responses:
        "200":
          description: Validated provider-neutral binding plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingPlan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/plans/apply:
    post:
      tags:
        - Operator
      operationId: applyProviderBindingPlan
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPlanRequest"
      responses:
        "200":
          description: Validated applied provider resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedBindingResources"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/bindings/discover:
    post:
      tags:
        - Operator
      operationId: discoverProviderBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingDiscoveryRequest"
      responses:
        "200":
          description: Validated discovered provider resources and drift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveredBindingResources"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/operator/provider-instances/{providerInstanceId}/bindings/delete:
    post:
      tags:
        - Operator
      operationId: deleteProviderBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingOperationRequest"
      responses:
        "200":
          description: Validated provider deletion evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionEvidence"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/providers/{providerId}/{adapterVersion}/{mode}/instances/{providerInstanceId}/inbound:
    post:
      tags:
        - Provider ingress
      operationId: ingestProviderMessageAtRoot
      description:
        The exact provider adapter authenticates and consumes the one-shot byte stream at its
        registered provider path.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/AdapterVersion"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/ProviderInstanceId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Adapter-defined safe success response.
        "202":
          description: Verified ingress was durably accepted or recognized as a replay.
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    rawGrantAuth:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderId"
    AdapterVersion:
      name: adapterVersion
      in: path
      required: true
      schema:
        maxLength: 128
        minLength: 1
        type: string
    Mode:
      name: mode
      in: path
      required: true
      schema:
        maxLength: 128
        minLength: 1
        pattern: ^[a-z][a-z0-9_-]*$
        type: string
    ProviderInstanceId:
      name: providerInstanceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderInstanceId"
    ProviderPath:
      name: providerPath
      in: path
      required: true
      description: Adapter-owned ingress path segment, such as raw-mime for Mailgun.
      schema:
        maxLength: 128
        minLength: 1
        type: string
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TenantId"
    IntentId:
      name: intentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IntentId"
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ReceiptId"
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RawAccessGrantId"
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BindingId"
    BindingVersion:
      name: bindingVersion
      in: path
      required: true
      schema:
        maxLength: 16
        minLength: 1
        pattern: ^[1-9][0-9]{0,15}$
        type: string
  responses:
    Problem:
      description: Versioned privacy-safe Mail Edge problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/MailEdgeProblem"
  schemas:
    AdapterIdentity:
      $id: urn:mail-edge:reference-service:schema:v1:adapter-identity
      additionalProperties: false
      type: object
      properties:
        providerId:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          type: string
        adapterVersion:
          maxLength: 128
          minLength: 1
          type: string
        mode:
          maxLength: 128
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
          type: string
      required:
        - providerId
        - adapterVersion
        - mode
    AppliedBindingResources:
      $id: urn:mail-edge:reference-service:schema:v1:applied-binding-resources
      additionalProperties: false
      type: object
      properties:
        schemaVersion:
          const: v1
          type: string
        providerResourceIds:
          maxProperties: 64
          type: object
          patternProperties:
            ^(.*)$:
              maxLength: 512
              type: string
        planDigest:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          type: string
        appliedAt:
          maxLength: 35
          minLength: 20
          type: string
        normalizedEvidence:
          maxProperties: 64
          type: object
          patternProperties:
            ^[A-Za-z][A-Za-z0-9_-]*$:
              anyOf:
                - maxLength: 256
                  type: string
                - type: number
                - type: boolean
      required:
        - schemaVersion
        - providerResourceIds
        - planDigest
        - appliedAt
        - normalizedEvidence
    ApplyPlanRequest:
      $id: urn:mail-edge:reference-service:schema:v1:apply-plan-request
      additionalProperties: false
      type: object
      properties:
        operation:
          $ref: "#/components/schemas/ControlOperation"
        plan:
          $ref: "#/components/schemas/BindingPlan"
      required:
        - operation
        - plan
    BindingDiscoveryRequest:
      $id: urn:mail-edge:reference-service:schema:v1:binding-discovery-request
      additionalProperties: false
      type: object
      properties:
        binding:
          $ref: "#/components/schemas/RouteBindingSnapshot"
      required:
        - binding
    BindingOperationRequest:
      $id: urn:mail-edge:reference-service:schema:v1:binding-operation-request
      additionalProperties: false
      type: object
      properties:
        binding:
