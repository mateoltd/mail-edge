        evidence: { type: object, maxProperties: 64 }
        expectedFence: { type: integer, minimum: 0 }
        expectedVersion: { type: integer, minimum: 0 }
        reasonCode: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    InboundQuarantineDecision:
      type: object
      additionalProperties: false
      required: [action, evidence, expectedFence, expectedVersion, reasonCode]
      properties:
        action: { type: string, enum: [release, terminal] }
        evidence: { type: object, maxProperties: 64 }
        expectedFence: { type: integer, minimum: 0 }
        expectedVersion: { type: integer, minimum: 0 }
        reasonCode: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    AdapterIdentity:
      type: object
      additionalProperties: false
      required: [providerId, adapterVersion, mode]
