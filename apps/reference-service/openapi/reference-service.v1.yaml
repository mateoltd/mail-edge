        - tenantId
        - domainALabel
        - direction
        - providerId
        - adapterVersion
        - providerInstanceId
        - providerResourceIds
        - capabilityDigest
        - configRevision
        - createdAt
      properties:
        schemaVersion:
          const: v1
        bindingId:
          $ref: "#/components/schemas/UuidV7"
        bindingVersion:
          type: integer
          minimum: 1
        tenantId:
          $ref: "#/components/schemas/UuidV7"
        domainALabel:
          type: string
          minLength: 1
          maxLength: 253
        direction:
          type: string
          enum: [inbound, outbound]
        providerId:
          $ref: "#/components/schemas/ProviderId"
        adapterVersion:
          type: string
          minLength: 1
          maxLength: 128
        providerInstanceId:
          $ref: "#/components/schemas/UuidV7"
        providerResourceIds:
          type: object
          maxProperties: 64
          additionalProperties:
