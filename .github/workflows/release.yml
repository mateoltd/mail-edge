name: Release

on:
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Publish and attest release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_PROVENANCE: "true"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js and npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository gate
        run: pnpm verify
      - name: Publish eligible packages with provenance
        run: pnpm exec changeset publish
      - name: Build release evidence
        run: |
          git archive --format=tar.gz --prefix=mail-edge/ --output=mail-edge-source.tar.gz HEAD
          pnpm sbom:generate --output=mail-edge-sbom.cdx.json
          sha256sum mail-edge-source.tar.gz mail-edge-sbom.cdx.json > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign release evidence
        run: |
          cosign sign-blob --yes --bundle mail-edge-source.tar.gz.sigstore.json mail-edge-source.tar.gz
          cosign sign-blob --yes --bundle mail-edge-sbom.cdx.json.sigstore.json mail-edge-sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: mail-edge-source.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: mail-edge-sbom.cdx.json
          subject-path: mail-edge-source.tar.gz
      - name: Upload signed release evidence
        run: >-
          gh release upload "$RELEASE_TAG" mail-edge-source.tar.gz
          mail-edge-source.tar.gz.sigstore.json mail-edge-sbom.cdx.json
          mail-edge-sbom.cdx.json.sigstore.json SHA256SUMS
