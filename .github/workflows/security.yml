name: Security and supply chain

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 3"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: none
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load shared license policy
        id: license-policy
        run: node scripts/dependency-license-policy.mjs --github-output
      - name: Review dependency changes
        id: review
        # The following step accepts only exact reviewed license findings.
        # Missing outputs, new licenses and vulnerabilities still fail the job.
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: ${{ steps.license-policy.outputs.allow-licenses }}
          fail-on-scopes: runtime, development
          fail-on-severity: moderate
          license-check: true
          vulnerability-check: true

      - name: Apply exact artifact license reviews
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          VULNERABLE_CHANGES: ${{ steps.review.outputs.vulnerable-changes }}
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          REVIEW_SUMMARY: ${{ steps.review.outputs.comment-content }}
        # Use a file: the full comparison can exceed Linux's per-variable env limit.
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" \
            > "$RUNNER_TEMP/dependency-changes.json"
          node scripts/check-dependency-review.mjs "$RUNNER_TEMP/dependency-changes.json"

  osv:
    name: OSV
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: true
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      upload-sarif: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  policy:
    name: License, action, and SBOM policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check action pins
        run: pnpm actions:check
      - name: Check dependency licenses
        run: pnpm license:check
      - name: Generate and validate SBOM
        run: pnpm sbom:check
